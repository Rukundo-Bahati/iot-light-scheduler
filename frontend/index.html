<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IoT Light Scheduler</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.1.0/mqttws31.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Graphical Light Scheduler</h2>
    <form onsubmit="submitSchedule(event)">
      <div class="ontime">
        <label for="onTime">On Time:</label> 
        <input type="time" id="onTime" required>
      </div>
      <div class="offtime">
        <label for="offTime">Off Time:</label>
        <input type="time" id="offTime" required>
      </div>
      <button type="submit">Submit</button>
      <p id="status"></p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
